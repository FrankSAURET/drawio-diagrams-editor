name: Lint & Build
on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Code portable sur les 3 OS, mais testé sur la plateforme de développement seule (Windows).
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      # Charge draw.io + greffons dans un vrai navigateur (Chrome des executeurs).
      - run: yarn test-webview

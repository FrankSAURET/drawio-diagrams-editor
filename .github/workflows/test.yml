name: Lint & Build
on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      # Chaque OS va au bout : un échec sur l'un n'annule plus les autres.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      # Charge draw.io + greffons dans un vrai navigateur (Chrome des executeurs).
      - run: yarn test-webview
